version: "3.9"

services:
  redis:
    image: redis:7.2-alpine
    container_name: agentbridge-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  python-agent-gateway:
    build: .
    container_name: python-agent-gateway
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    ports:
      - "50051:50051"
      - "8089:8089"
      - "9102:9102"
